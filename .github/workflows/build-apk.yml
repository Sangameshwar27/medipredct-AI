name: Build MediPredict AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Capacitor project
        run: |
          mkdir medipredict-app
          cd medipredict-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          mkdir www
          cp ../index.html www/index.html
          npx cap init "MediPredict AI" "com.medipredict.ai" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd medipredict-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediPredict-AI-APK
          path: medipredict-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
